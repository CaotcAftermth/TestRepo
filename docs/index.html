<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GG Fizz Cluster — Dino Depot Guide</title>
<style>
:root{
  --bg:#0c0e0a;--bg2:#12150e;--panel:#171b12;--panel2:#1e2317;
  --line:#2c3322;--line2:#3d4630;
  --amber:#e8a33d;--amber2:#f5c069;--teal:#4fd1c5;
  --text:#e6e2d3;--dim:#9b9784;--faint:#6b6858;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scrollbar-color:var(--line2) transparent}
body{
  background:
    radial-gradient(1200px 500px at 50% -10%, rgba(232,163,61,.08), transparent 60%),
    linear-gradient(var(--bg), var(--bg2));
  color:var(--text);
  font:15px/1.55 "Segoe UI",system-ui,sans-serif;
  min-height:100vh;
}
.wrap{max-width:1100px;margin:0 auto;padding:28px 20px 80px}
header{text-align:center;margin-bottom:26px}
.kicker{
  font-size:11px;letter-spacing:.35em;text-transform:uppercase;color:var(--amber);
  margin-bottom:6px;font-weight:700;
}
h1{
  font-size:clamp(26px,5vw,40px);font-weight:800;letter-spacing:.04em;
  text-transform:uppercase;
  background:linear-gradient(180deg,#fff,var(--amber2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.sub{color:var(--dim);margin-top:6px;font-size:14px}
.controls{
  display:flex;gap:10px;justify-content:center;align-items:center;
  flex-wrap:wrap;margin:22px 0 8px;position:sticky;top:0;z-index:20;
  padding:12px 0;background:linear-gradient(var(--bg) 70%,transparent);
}
.tabs{display:flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.tabs button{
  background:var(--panel);color:var(--dim);border:0;padding:9px 22px;
  font:inherit;font-weight:600;cursor:pointer;letter-spacing:.05em;
}
.tabs button.on{background:var(--amber);color:#1a1408}
#q{
  background:var(--panel);border:1px solid var(--line2);border-radius:10px;
  color:var(--text);padding:9px 14px;font:inherit;width:min(360px,80vw);outline:0;
}
#q:focus{border-color:var(--amber)}
.count{color:var(--faint);font-size:12px;width:100%;text-align:center}
.grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  gap:10px;margin-top:14px;
}
.card{
  display:flex;align-items:center;gap:11px;text-align:left;
  background:linear-gradient(160deg,var(--panel2),var(--panel));
  border:1px solid var(--line);border-radius:12px;padding:11px 13px;
  cursor:pointer;font:inherit;color:var(--text);transition:.15s;
}
.card:hover{border-color:var(--amber);transform:translateY(-1px)}
.card .ic{font-size:24px;width:32px;text-align:center;flex:none}
.card .nm{font-weight:600;font-size:14px}
.card .ct{color:var(--faint);font-size:11.5px;letter-spacing:.04em}
.card .n{
  margin-left:auto;flex:none;background:rgba(232,163,61,.12);color:var(--amber2);
  border:1px solid rgba(232,163,61,.25);font-size:11px;border-radius:99px;
  padding:2px 8px;font-weight:700;
}
.empty{color:var(--faint);text-align:center;padding:60px 0}
/* detail overlay */
.ov{position:fixed;inset:0;background:rgba(5,6,3,.75);backdrop-filter:blur(3px);
  display:none;align-items:flex-start;justify-content:center;overflow-y:auto;
  padding:40px 16px;z-index:50}
.ov.on{display:flex}
.sheet{
  width:min(760px,100%);background:linear-gradient(170deg,#1c2114,#141810);
  border:1px solid var(--line2);border-radius:16px;padding:26px 28px 30px;
  box-shadow:0 30px 80px rgba(0,0,0,.6);
}
.sheet .top{display:flex;gap:16px;align-items:center;margin-bottom:4px}
.sheet .big{font-size:44px;line-height:1}
.sheet h2{font-size:24px;font-weight:800;letter-spacing:.03em}
.sheet .cat{color:var(--amber);font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:700}
.sheet .cls{color:var(--faint);font-size:12px;font-family:Consolas,monospace;margin-top:2px;word-break:break-all}
.x{margin-left:auto;background:none;border:1px solid var(--line2);color:var(--dim);
  border-radius:8px;width:32px;height:32px;font-size:16px;cursor:pointer;flex:none}
.x:hover{color:#fff;border-color:var(--amber)}
.sec{margin-top:20px}
.sec>h3{
  font-size:12px;letter-spacing:.25em;text-transform:uppercase;color:var(--amber);
  border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:12px;font-weight:700;
}
.cycle{background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;margin-bottom:10px}
.cycle .meta{color:var(--dim);font-size:12.5px;margin-bottom:8px}
.cycle .meta b{color:var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  display:inline-flex;align-items:center;gap:7px;background:var(--panel2);
  border:1px solid var(--line2);border-radius:99px;padding:5px 12px 5px 8px;
  cursor:pointer;font:inherit;font-size:13px;color:var(--text);transition:.12s;
}
.chip:hover{border-color:var(--teal);color:#fff}
.chip .q{color:var(--amber2);font-weight:700}
.chip.alt{border-style:dashed;border-color:#7c6bb1}
.chip.con{border-color:#a15050}
.chip.con .q{color:#e88}
.lbl{font-size:11px;color:var(--faint);letter-spacing:.1em;text-transform:uppercase;
  width:100%;margin:4px 0 -1px}
.info{color:var(--text);font-size:14px}
.info h1,.info h2,.info h3{margin:14px 0 6px;color:var(--amber2);font-size:15px;
  letter-spacing:.08em;text-transform:uppercase}
.info p{margin:6px 0;color:#cfcaba}
.info ul{margin:6px 0 6px 20px;color:#cfcaba}
.info b{color:#fff}
footer{text-align:center;color:var(--faint);font-size:12px;margin-top:50px}
.err{color:#e88;text-align:center;padding:60px 0}
@media (max-width:560px){.sheet{padding:20px 16px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">Dino Depot · Passive Production</div>
    <h1>GG Fizz Cluster</h1>
    <div class="sub">What does it produce? Who makes it? Look it up below.</div>
  </header>

  <div class="controls">
    <div class="tabs">
      <button id="tabC" class="on">Creatures</button>
      <button id="tabI">Items</button>
    </div>
    <input id="q" type="search" placeholder="Search…" autocomplete="off">
    <div class="count" id="count"></div>
  </div>

  <div id="grid" class="grid"></div>
  <div id="msg" class="empty" style="display:none"></div>

  <footer>Powered by Dino Depot Studio · data updates automatically when the admin publishes</footer>
</div>

<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>

<script>
const DATA_URL = "https://raw.githubusercontent.com/CaotcAftermth/TestRepo/main/dinodepot/viewer-data.json";
let DATA = null, TAB = "c", Q = "";
const $ = (id) => document.getElementById(id);

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function md(src){
  if(!src) return "";
  const lines = esc(src).split(/\r?\n/);
  let out = "", list = false, para = [];
  const flush = () => {
    if(para.length){ out += "<p>" + inline(para.join(" ")) + "</p>"; para = []; }
  };
  const inline = (s) => s
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/\*([^*]+)\*/g, "<i>$1</i>");
  for(const raw of lines){
    const line = raw.trim();
    const h = line.match(/^(#{1,3})\s+(.*)/);
    if(h){ flush(); if(list){out+="</ul>";list=false;}
      out += "<h3>" + inline(h[2]) + "</h3>"; continue; }
    if(line.startsWith("- ")){ flush(); if(!list){out+="<ul>";list=true;}
      out += "<li>" + inline(line.slice(2)) + "</li>"; continue; }
    if(line === ""){ flush(); if(list){out+="</ul>";list=false;} continue; }
    para.push(line);
  }
  flush(); if(list) out += "</ul>";
  return out;
}

function fmtInterval(s){
  if(s < 60) return s + "s";
  if(s < 3600){ const m = Math.floor(s/60), r = s%60; return r ? m+"m "+r+"s" : m+"m"; }
  const h = Math.floor(s/3600), m = Math.round((s%3600)/60);
  return m ? h+"h "+m+"m" : h+"h";
}
const pct = (v) => Math.round(v*100) + "%";

const byId = { c:new Map(), i:new Map() };

function render(){
  const grid = $("grid"), msg = $("msg");
  const list = TAB === "c" ? DATA.creatures : DATA.items;
  const q = Q.toLowerCase();
  const filtered = q
    ? list.filter(e => e.name.toLowerCase().includes(q) ||
        (e.category||"").toLowerCase().includes(q))
    : list;
  $("count").textContent = filtered.length + (TAB==="c" ? " producing creatures" : " items");
  grid.innerHTML = "";
  msg.style.display = filtered.length ? "none" : "";
  msg.textContent = "No matches.";
  for(const e of filtered){
    const b = document.createElement("button");
    b.className = "card";
    const n = TAB === "c"
      ? e.cycles.reduce((t,c)=>t+c.items.length,0)
      : e.producedBy.length + e.alternateFrom.length;
    b.innerHTML = '<span class="ic">'+esc(e.icon)+'</span>' +
      '<span><span class="nm">'+esc(e.name)+'</span><br><span class="ct">'+esc(e.category||"")+'</span></span>' +
      (n ? '<span class="n">'+n+'</span>' : '');
    b.onclick = () => openDetail(TAB, e.id);
    grid.appendChild(b);
  }
}

function chip(kind, ref, qty, cls){
  const target = byId[kind].get(ref);
  const name = target ? target.name : ref.split("/").pop().split(".")[0];
  const icon = target ? target.icon : (kind === "c" ? "🦕" : "📦");
  return '<button class="chip '+(cls||"")+'" onclick="openDetail(\''+kind+'\',\''+esc(ref).replace(/'/g,"\\'")+'\')">' +
    '<span>'+esc(icon)+'</span><span>'+esc(name)+'</span>' +
    (qty != null ? '<span class="q">×'+qty+'</span>' : '') + '</button>';
}

function openDetail(kind, id){
  const e = byId[kind].get(id);
  if(!e) return;
  let body = '<div class="top"><span class="big">'+esc(e.icon)+'</span><span>' +
    '<div class="cat">'+esc(e.category||"")+'</div><h2>'+esc(e.name)+'</h2>' +
    '<div class="cls">'+esc(e.cls || e.id)+'</div></span>' +
    '<button class="x" onclick="closeOv()">✕</button></div>';

  if(kind === "c"){
    body += '<div class="sec"><h3>Produces' +
      (e.chance < 1 ? ' · '+pct(e.chance)+' chance per attempt' : '') + '</h3>';
    if(!e.cycles.length) body += '<div class="empty">No production cycles.</div>';
    for(const c of e.cycles){
      body += '<div class="cycle"><div class="meta">' +
        (c.name ? '<b>'+esc(c.name)+'</b> · ' : '') +
        'every <b>'+fmtInterval(c.interval)+'</b>' +
        (c.items.length > 1 ? ' · '+c.mode+' of '+c.items.length+' items' : '') +
        '</div><div class="chips">';
      for(const it of c.items){
        body += chip("i", it.ref, it.qty);
        if(it.alternates.length){
          body += '<span class="lbl">🎲 Alternates ('+pct(it.altChance)+' chance)</span>';
          for(const a of it.alternates) body += chip("i", a.ref, a.qty, "alt");
        }
        if(it.consumes.length){
          body += '<span class="lbl">🔻 Consumes' +
            (it.consumeChance < 1 ? ' ('+pct(it.consumeChance)+' chance)' : '') + '</span>';
          for(const cn of it.consumes) body += chip("i", cn.ref, cn.qty, "con");
        }
      }
      body += '</div></div>';
    }
    body += '</div>';
  } else {
    if(e.producedBy.length){
      body += '<div class="sec"><h3>Produced by</h3><div class="chips">' +
        e.producedBy.map(r => chip("c", r)).join("") + '</div></div>';
    }
    if(e.alternateFrom.length){
      body += '<div class="sec"><h3>🎲 Alternate drop from</h3><div class="chips">' +
        e.alternateFrom.map(r => chip("c", r, null, "alt")).join("") + '</div></div>';
    }
    if(e.consumedBy.length){
      body += '<div class="sec"><h3>🔻 Consumed by</h3><div class="chips">' +
        e.consumedBy.map(r => chip("c", r, null, "con")).join("") + '</div></div>';
    }
    if(!e.producedBy.length && !e.alternateFrom.length && !e.consumedBy.length){
      body += '<div class="empty">Not referenced by any production rule.</div>';
    }
  }

  if(e.info){
    body += '<div class="sec"><h3>About</h3><div class="info">'+md(e.info)+'</div></div>';
  }

  $("sheet").innerHTML = body;
  $("ov").classList.add("on");
}
function closeOv(){ $("ov").classList.remove("on"); }
$("ov").addEventListener("click", (ev) => { if(ev.target === $("ov")) closeOv(); });
document.addEventListener("keydown", (ev) => { if(ev.key === "Escape") closeOv(); });

$("tabC").onclick = () => { TAB="c"; $("tabC").classList.add("on"); $("tabI").classList.remove("on"); render(); };
$("tabI").onclick = () => { TAB="i"; $("tabI").classList.add("on"); $("tabC").classList.remove("on"); render(); };
$("q").addEventListener("input", (ev) => { Q = ev.target.value; render(); });

fetch(DATA_URL, { cache: "no-cache" })
  .then(r => { if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
  .then(data => {
    DATA = data;
    for(const c of data.creatures) byId.c.set(c.id, c);
    for(const i of data.items) byId.i.set(i.id, i);
    render();
  })
  .catch(err => {
    $("msg").style.display = "";
    $("msg").className = "err";
    $("msg").textContent = "Could not load production data (" + err.message + "). Try refreshing.";
  });
</script>
</body>
</html>
